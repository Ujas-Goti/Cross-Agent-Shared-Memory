version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: casm_postgres
    environment:
      POSTGRES_USER: casm_user
      POSTGRES_PASSWORD: casm_password
      POSTGRES_DB: casm_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casm_user -d casm_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  casm_api:
    build: .
    container_name: casm_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://casm_user:casm_password@postgres:5432/casm_db
      SECRET_KEY: your-secret-key-change-in-production
      API_KEY: test-api-key-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:

